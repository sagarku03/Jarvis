# Stage 7: Cloud Build CI/CD pipeline for JARVIS Backend Proxy
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/jarvis-repo/jarvis-proxy:$COMMIT_SHA'
      - './backend-proxy'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/jarvis-repo/jarvis-proxy:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jarvis-backend-proxy'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/jarvis-repo/jarvis-proxy:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,VERTEX_LOCATION=asia-south1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/jarvis-repo/jarvis-proxy:$COMMIT_SHA'
