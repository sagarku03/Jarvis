name: Android CI & Gemini 3.8 Live Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure stable deterministic debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ ! -f debug.keystore.base64 ]; then
            echo "Generating deterministic debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w 0 debug.keystore > debug.keystore.base64
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add debug.keystore.base64
            git commit -m "chore: persist deterministic debug.keystore.base64 [skip ci]" || true
            git push origin HEAD:${{ github.ref }} || true
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare .env from template if absent
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Named Release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS-v2.2.0-Gemini3.8.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v2.2.0-Gemini3.8.apk
          path: JARVIS-v2.2.0-Gemini3.8.apk

      - name: Assemble Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Release APK artifact
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/*.apk

  live-gemini-verification:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_TEST: ${{ secrets.GEMINI_API_KEY_TEST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Live Gemini 3.8 Verification Suite
        run: |
          chmod +x scripts/verify_gemini_live.py
          python3 scripts/verify_gemini_live.py

      - name: Upload Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: VERIFICATION.md
          path: VERIFICATION.md

  publish-release:
    needs: [build-and-test, live-gemini-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-v2.2.0-Gemini3.8.apk

      - name: Download Verification Report
        uses: actions/download-artifact@v4
        with:
          name: VERIFICATION.md

      - name: Create or Update GitHub Release v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2.0 --yes 2>/dev/null || true
          git tag -d v2.2.0 2>/dev/null || true
          git push origin :refs/tags/v2.2.0 2>/dev/null || true
          gh release create v2.2.0 \
            JARVIS-v2.2.0-Gemini3.8.apk \
            VERIFICATION.md \
            --title "JARVIS v2.2.0 - Gemini 3.8 Cascade & Real-Time Live Architecture" \
            --notes-file VERIFICATION.md
